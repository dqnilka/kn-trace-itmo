# Evaluation runner — generates quality report as .md
#
# Usage:
#   Autonomous (no LLM):
#     docker compose -f docker-compose.eval.yml up eval
#
#   With LLM-as-judge (requires API key in .env):
#     docker compose -f docker-compose.eval.yml run eval-with-llm
#
#   Custom args via shell:
#     docker compose -f docker-compose.eval.yml run eval-shell --with-llm
#
# Yandex Cloud example:
#   LLM_API_KEY=your-token LLM_BASE_URL=https://llm.api.cloud.yandex.net/foundationModels/v1 \
#     LLM_MODEL=yandexgpt-lite docker compose -f docker-compose.eval.yml run eval-with-llm

services:
  eval:
    build:
      context: .
      dockerfile: Dockerfile.eval
    image: akt-eval:latest
    container_name: akt-eval
    environment:
      - EXAMS_DIR=/app/evaluation/fixtures
      - HF_HOME=/root/.cache/huggingface
    env_file:
      - path: .env
        required: false
    volumes:
      - ./evaluation_report.md:/app/evaluation_report.md
      - hf_cache_eval:/root/.cache/huggingface
    entrypoint: ["python", "-m", "evaluation", "--output", "/app/evaluation_report.md"]

  eval-with-llm:
    build:
      context: .
      dockerfile: Dockerfile.eval
    image: akt-eval:latest
    container_name: akt-eval-llm
    profiles: ["llm"]
    environment:
      - EXAMS_DIR=/app/evaluation/fixtures
      - HF_HOME=/root/.cache/huggingface
    env_file:
      - path: .env
        required: false
    volumes:
      - ./evaluation_report.md:/app/evaluation_report.md
      - hf_cache_eval:/root/.cache/huggingface
    entrypoint: ["python", "-m", "evaluation", "--output", "/app/evaluation_report.md", "--with-llm"]

  eval-shell:
    build:
      context: .
      dockerfile: Dockerfile.eval
    image: akt-eval:latest
    container_name: akt-eval-shell
    profiles: ["shell"]
    environment:
      - EXAMS_DIR=/app/evaluation/fixtures
      - HF_HOME=/root/.cache/huggingface
    env_file:
      - path: .env
        required: false
    volumes:
      - ./evaluation_report.md:/app/evaluation_report.md
      - hf_cache_eval:/root/.cache/huggingface
    entrypoint: ["python", "-m", "evaluation"]

volumes:
  hf_cache_eval:
