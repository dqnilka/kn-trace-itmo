[project]
name = "ai-knowledge-tracing"
version = "0.1.0"
description = "AI Knowledge Tracing backend: graph-based + RAG study plan generator for Russian financial markets exam (FSFR)."
requires-python = ">=3.11,<3.13"
authors = [{ name = "AI Knowledge Tracing" }]
readme = "README.md"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "orjson>=3.10",
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.4",
    # transformers >= 4.46 introduces torch.library.custom_op usage that
    # requires torch >= 2.5. We pin torch==2.4.1 in the Dockerfile for CPU-only
    # builds, so cap the upper end of these libs to stay compatible.
    "transformers>=4.40,<4.46",
    "sentence-transformers>=2.7,<3.1",
    "chromadb>=0.4.24",
    "openai>=1.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # Vendored k2-18 viewer requires Jinja2 to render templates.
    "jinja2>=3.1",
    # Admin uses scripts/convert_bank.py to ingest uploaded XLSX in-process.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests requiring a running container/service",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
